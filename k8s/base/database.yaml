apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  clusterIP: None
  selector: { app: oficina-os-service-database }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oficina-os-service-database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels: { app: oficina-os-service-database }
  template:
    metadata:
      labels: { app: oficina-os-service-database }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: database
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: os
            - name: POSTGRES_DB
              value: os
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: service-secrets, key: DATABASE_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
